[package]
name = "cardano-tracer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
chrono = "0.4"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
pallas = { path = "../../pallas", features = ["hardano"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
glob = "0.3"
