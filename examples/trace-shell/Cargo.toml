[package]
name = "trace-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
pallas = { path = "../../pallas", features = ["hardano"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
rustyline = "14"
