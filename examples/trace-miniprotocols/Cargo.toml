[package]
name = "trace-miniprotocols"
version = "0.1.0"
edition = "2021"

[dependencies]
pallas = { path = "../../pallas", features = ["hardano"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
